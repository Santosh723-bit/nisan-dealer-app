<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="robots" content="noindex">
<title>Quotation app retired</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111}
.c{background:#fff;border-radius:18px;padding:24px 20px;max-width:360px;margin:16px;text-align:center}
h1{font-size:20px;margin:0 0 8px}p{color:#555;font-size:14px;line-height:1.5;margin:0 0 16px}
a{display:block;background:#111;color:#F5C21B;text-decoration:none;font-weight:700;border-radius:12px;padding:14px;margin-top:10px}</style></head>
<body><div class="c"><h1>Quotation app is retired</h1>
<p>NPRO QUOTATION and QUOTE MASTER have been taken offline. They will come back later as a separate app. You can remove this icon.</p>
<a href="../master.html">Open PARTNER MASTER</a><a href="../">Open PARTNER (dealer app)</a></div>
<script>try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){if(x.scope.indexOf("/quotation/")>=0)x.unregister()})});caches&&caches.keys().then(function(k){k.forEach(function(n){if(n.indexOf("npro-quote")===0)caches.delete(n)})})}catch(e){}</script>
</body></html>
